{% extends "base.html" %}

{% block title %}Acceder — {{ APP_NAME }}{% endblock %}

{% block content_anon %}
<div class="container" style="max-width: 380px; margin-top: 8vh;">
  <div class="card-panel">
    <h1 class="h4 mb-1 text-center">Gestor<span style="color:#1abb9c">ISP</span></h1>
    <p class="text-center text-muted small mb-4">Panel de administración</p>
    {% if form.errors %}
      <div class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="id_username">Usuario</label>
        <input type="text" name="username" id="id_username" class="form-control" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">Contraseña</label>
        <input type="password" name="password" id="id_password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-success w-100" style="background:#1abb9c;border-color:#1abb9c">Entrar</button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>
  </div>
</div>
{% endblock %}
