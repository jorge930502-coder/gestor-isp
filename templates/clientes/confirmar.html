{% extends "base.html" %}
{% block title %}{{ titulo }} — {{ APP_NAME }}{% endblock %}
{% block page_title %}{{ titulo }}{% endblock %}
{% block nav_clientes %}active{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card-panel">
      <p class="fs-5">{{ mensaje }}</p>
      <form method="post" action="{{ request.get_full_path }}">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, continuar</button>
        <a href="{{ volver_url }}" class="btn btn-outline-secondary">Cancelar</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
